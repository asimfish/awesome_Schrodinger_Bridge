<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Awesome Schrödinger Bridge · 调研汇报 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#003366;--red:#CC0000;--blue:#0066CC;--bg:#EEF3F8;--ink:#222;--muted:#666;--line:#D6DEE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c2430;font-family:'PingFang SC','Noto Sans CJK SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{width:1280px;height:720px;background:#fff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;display:none;overflow:hidden}
.slide.active{display:block}
.hdr{position:absolute;left:0;top:0;width:1280px;height:70px;background:var(--navy)}
.hdr::before{content:"";position:absolute;left:0;top:0;width:6px;height:70px;background:var(--red)}
.hdr h1{margin:0;position:absolute;left:40px;top:0;line-height:70px;color:#fff;font-size:28px;font-weight:700;letter-spacing:.5px}
.hdr .sec{position:absolute;right:40px;top:0;line-height:70px;color:#B8CCE4;font-size:15px}
.key{position:absolute;left:40px;top:84px;width:1200px;min-height:44px;background:var(--bg);border-left:5px solid var(--blue);padding:10px 16px;font-size:18px;line-height:1.35;color:var(--navy);font-weight:600}
.body{position:absolute;left:40px;top:150px;width:1200px;height:500px;font-size:19px;line-height:1.5}
.ftr{position:absolute;left:40px;right:40px;bottom:14px;height:26px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;display:flex;justify-content:space-between}
ul{margin:0;padding-left:26px}li{margin:6px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.card{background:var(--bg);border-radius:8px;padding:16px 18px;border-top:4px solid var(--blue)}
.card.red{border-top-color:var(--red)}
.card h3{margin:0 0 8px;font-size:20px;color:var(--navy)}
.card p,.card li{font-size:17px;line-height:1.45;margin:4px 0}
.card ul{padding-left:20px}
table{border-collapse:collapse;width:100%;font-size:16.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#F7F9FC}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:700;margin-right:6px;vertical-align:middle}
.tag.red{background:var(--red)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi div{background:#fff;border:2px solid var(--red);border-radius:8px;text-align:center;padding:18px 10px}
.kpi b{display:block;font-size:44px;color:var(--red);line-height:1.1}
.kpi span{font-size:15px;color:var(--muted)}
.src{position:absolute;left:40px;bottom:48px;font-size:13px;color:var(--muted)}
/* cover */
.cover{background:#fff}
.cover .bar{position:absolute;left:0;top:0;width:1280px;height:16px;background:var(--navy)}
.cover .vbar{position:absolute;left:80px;top:150px;width:8px;height:300px;background:var(--red)}
.cover h1{position:absolute;left:120px;top:150px;width:1080px;margin:0;font-size:56px;line-height:1.15;color:var(--navy)}
.cover h2{position:absolute;left:120px;top:300px;width:1080px;margin:0;font-size:26px;font-weight:500;color:var(--muted);line-height:1.4}
.cover .meta{position:absolute;left:120px;top:440px;font-size:18px;color:var(--ink);line-height:1.7}
.cover .foot{position:absolute;left:0;bottom:0;width:1280px;height:60px;background:var(--bg);color:var(--muted);font-size:15px;line-height:60px;padding-left:120px}
/* chapter */
.chapter{background:var(--navy)}
.chapter .num{position:absolute;right:80px;top:60px;font-size:260px;font-weight:800;color:#fff;opacity:.08;line-height:1}
.chapter .vbar{position:absolute;left:80px;top:230px;width:8px;height:180px;background:var(--red)}
.chapter h1{position:absolute;left:120px;top:230px;margin:0;font-size:54px;color:#fff}
.chapter p{position:absolute;left:120px;top:330px;margin:0;font-size:24px;color:#B8CCE4;width:900px;line-height:1.5}
.chapter .rule{position:absolute;left:120px;top:420px;width:120px;height:4px;background:var(--red)}
/* toc */
.toc{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.toc div{background:var(--bg);border-left:6px solid var(--blue);padding:14px 18px;border-radius:6px}
.toc b{display:block;font-size:22px;color:var(--navy)}.toc span{font-size:16px;color:var(--muted)}
.fig{width:1200px;height:500px;display:block}
.nav{position:fixed;right:18px;bottom:14px;color:#9fb3c8;font-size:13px;font-family:Menlo,monospace;z-index:9}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:#fff}
  #stage{position:static;display:block}
  .slide{display:block;position:relative;left:0;top:0;transform:none;page-break-after:always;break-after:page;margin:0}
  .slide:last-child{page-break-after:auto}
  .nav{display:none}
}
</style>
</head>
<body>
<div id="stage">
{{SLIDES}}
</div>
<div class="nav">← / → 翻页 · Home/End · 共 <span id="total"></span> 页 · 打印即导出 PDF</div>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide')),i=0;
  function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);document.documentElement.style.setProperty('--s',s)}
  function show(k){i=(k+slides.length)%slides.length;slides.forEach(function(el,j){el.classList.toggle('active',j===i)});location.hash='#'+(i+1);
    var pn=slides[i].querySelector('.pn');}
  addEventListener('resize',fit);fit();
  addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(i-1)}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(slides.length-1)}});
  document.addEventListener('click',function(e){if(e.clientX>innerWidth*0.7)show(i+1);else if(e.clientX<innerWidth*0.3)show(i-1)});
  document.getElementById('total').textContent=slides.length;
  var h=parseInt((location.hash||'#1').slice(1))||1;show(h-1);
})();
</script>
</body>
</html>
